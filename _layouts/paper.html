<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} | 论文阅读</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/paper-reading.css' | relative_url }}">
  <script>window.MathJax = {tex: {inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']]}, chtml: {matchFontHeight: false}};</script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="{{ '/papers/' | relative_url }}"><span class="brand__mark" aria-hidden="true">R</span><span>论文阅读<small>RUI QIN · RESEARCH NOTES</small></span></a>
      <nav aria-label="主导航"><a href="{{ '/' | relative_url }}">个人主页</a><a href="{{ '/papers/' | relative_url }}">全部文章 <span aria-hidden="true">↗</span></a></nav>
    </div>
  </header>
  <main class="page-shell">
    <div class="page-meta"><span class="page-meta__label">{% if page.date %}研究解读{% else %}阅读档案{% endif %}</span>{% if page.date %}<span class="page-meta__divider" aria-hidden="true"></span><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%Y.%m.%d' }}</time>{% endif %}</div>
    <article class="reading-content{% unless page.date %} reading-content--index{% endunless %}">
      {{ content }}
    </article>
    <footer class="page-footer"><span>RUI QIN <span aria-hidden="true">/</span> 论文阅读</span><a href="{{ '/papers/' | relative_url }}">返回文章目录 ↑</a></footer>
  </main>
</body>
</html>
